[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-orchestrator-qc"
version = "0.1.0"
description = "AI Workflow Orchestrator for Quality Control Escalation & Root Cause Resolution"
readme = "README.md"
requires-python = ">=3.10"

authors = [{ name = "Santosh" }]

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # Data validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Logging & utilities
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
